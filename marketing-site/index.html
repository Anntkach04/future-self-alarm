<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Future Self Alarm — Wake up to your own voice</title>
    <meta
      name="description"
      content="Join the waitlist for Future Self Alarm. You’ll be the first to hear when it opens."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="waitlist-page">
    <main class="waitlist">
      <a class="brand" href="./index.html">
        <span class="brand-mark" aria-hidden="true">
          <img src="./assets/illustrations/logo-mark.png" alt="" />
        </span>
        <span class="brand-name">Future Self Alarm</span>
      </a>

      <p class="waitlist-kicker">The waitlist</p>
      <h1>Wake up to your<br /><em>own voice</em></h1>
      <p class="waitlist-lede">
        Join the waitlist. I’ll email you first when it opens.
      </p>

      <section class="waitlist-card" aria-labelledby="waitlist-title">
        <h2 id="waitlist-title" class="visually-hidden">Join the waitlist</h2>

        <form data-waitlist novalidate>
          <label class="field">
            <span>Name</span>
            <input name="name" type="text" autocomplete="name" placeholder="Your name" required />
          </label>
          <label class="field">
            <span>Email</span>
            <input
              name="email"
              type="email"
              autocomplete="email"
              inputmode="email"
              placeholder="you@email.com"
              required
            />
          </label>
          <p class="form-error" data-waitlist-error role="alert"></p>
          <button class="waitlist-submit" type="submit">
            Join the waitlist <span aria-hidden="true">→</span>
          </button>
        </form>

        <div class="waitlist-done" data-waitlist-done hidden>
          <p>You’re on the list. I’ll email you first when it opens.</p>
        </div>
      </section>

      <p class="waitlist-fine">
        Unsubscribe anytime ·
        <a href="mailto:dyniza@uxdyniza.com">dyniza@uxdyniza.com</a>
      </p>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
